name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: make test

  # WS49 — vulnerability gate (osv-scanner). BLOCKING: reads uv.lock; tree clean.
  # Pinned google/osv-scanner-action by SHA (v2.3.8).
  osv-scan:
    name: Vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # uv.lock is not auto-detected by the directory walk; scan it explicitly.
          scan-args: |-
            scan
            source
            --config=osv-scanner.toml
            --lockfile=uv.lock

  # WS50 — non-blocking dependency-freshness report.
  deps-report:
    name: Dependency freshness (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Report outdated dependencies
        run: |
          uv sync --all-extras --dev || true
          {
            echo '### Outdated dependencies (`uv pip list --outdated`)'
            echo '```'
            uv pip list --outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [build-test, osv-scan]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test did not succeed"; exit 1
          fi
          if [ "${{ needs.osv-scan.result }}" != "success" ]; then
            echo "osv-scan did not succeed"; exit 1
          fi
