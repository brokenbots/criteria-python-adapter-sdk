[project]
name = "criteria-adapter-sdk"
version = "0.1.0"
description = "Python SDK for building Criteria adapter plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-health-checking>=1.80.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.80.0",
    "nuitka>=4.0.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/criteria", "src/criteria_adapter_sdk"]
